<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skateboarder — LLM animated SVG benchmark</title>
<style>
  :root { --bg:#111; --card:#1c1c1c; --border:#333; --accent:#ffd700; --txt:#ddd; --mut:#888; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:16px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;
         display:flex; min-height:100vh; }
  aside { width:300px; min-width:260px; background:#161616; border-right:1px solid var(--border);
          padding:1.25rem; position:sticky; top:0; height:100vh; overflow-y:auto; }
  aside h1 { font-size:1.15rem; color:var(--accent); margin:0 0 .25rem; }
  aside .sub { color:var(--mut); font-size:.8rem; margin-bottom:1rem; }
  #search { width:100%; background:#0d0d0d; border:1px solid var(--border); color:var(--txt);
            border-radius:8px; padding:.5rem .75rem; font-size:.9rem; margin-bottom:.5rem; }
  #search:focus { outline:none; border-color:var(--accent); }
  .filters { display:flex; gap:.4rem; margin-bottom:1rem; flex-wrap:wrap; }
  .filters button { background:#0d0d0d; color:var(--mut); border:1px solid var(--border);
                    border-radius:6px; padding:.25rem .6rem; cursor:pointer; font-size:.78rem; }
  .filters button.active { color:#111; background:var(--accent); border-color:var(--accent); }
  #list .item { padding:.5rem .6rem; border-radius:8px; cursor:pointer; font-size:.85rem;
                display:flex; justify-content:space-between; gap:.5rem; align-items:center; }
  #list .item:hover { background:#222; }
  #list .item.sel { background:var(--accent); color:#111; }
  #list .item .err { color:#ff5555; font-size:.75rem; }
  #list .item .ok { color:#5f5; font-size:.75rem; }
  #list .item .modecount { color:var(--mut); font-size:.7rem; white-space:nowrap; }
  main { flex:1; padding:2rem; max-width:1000px; }
  body.comparing main { max-width:none; padding-right:1.5rem; }
  .cmpstack.side { position:relative; }
  .cmpstack.side .cards2 { max-height:calc(100vh - 4rem); overflow-y:auto; padding-right:.5rem; }
  .cmpstack.side .cards2 .svgwrap iframe { height:480px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.25rem; }
  .card h2 { color:var(--accent); margin:0 0 .25rem; font-size:1.2rem; }
  .meta { color:var(--mut); font-size:.85rem; margin:.25rem 0 1rem; }
  .meta b { color:var(--txt); font-weight:600; }
  .svgwrap { background:#000; border-radius:8px; overflow:hidden; }
  .svgwrap iframe { width:100%; height:480px; border:0; background:#000; }
  .actions { margin-top:1rem; display:flex; gap:.6rem; }
  .reasonbar { display:flex; align-items:center; gap:.5rem; margin:.35rem 0 1rem; color:var(--mut); font-size:.8rem; }
  .reasonbar select { background:#0d0d0d; color:var(--txt); border:1px solid var(--border);
                      border-radius:6px; padding:.25rem .5rem; font:inherit; }
  .reasonpill { color:var(--accent); font-weight:600; }
  .openbtn { display:inline-block; background:var(--accent); color:#111; padding:.35rem .9rem;
             border-radius:6px; text-decoration:none; font-size:.85rem; font-weight:600; }
  .openbtn:hover { background:#ffe44d; }
  .errorbox { color:#ff5555; background:#2a1515; border:1px solid #552222; border-radius:8px; padding:1rem; }
  .prompts summary { color:var(--accent); cursor:pointer; margin-top:1.5rem; }
  .prompts pre { white-space:pre-wrap; color:#bbb; font-size:.8rem; background:var(--card);
                 border:1px solid var(--border); border-radius:8px; padding:.75rem; }
  .welcome { max-width:47rem; }
  .welcome h2 { font-size:1.6rem; margin:.1rem 0; }
  .welcome .tagline { color:var(--accent); font-size:1.02rem; font-weight:600; margin:.1rem 0 1rem; }
  .welcome .lead { font-size:1.02rem; }
  .welcome p { color:#c8c8c8; }
  .welcome .plist { margin:.5rem 0 1rem; padding-left:1.2rem; }
  .welcome .plist li { margin:.4rem 0; }
  .welcome .plist li::marker { color:var(--accent); }
  .welcome .plist b { color:var(--accent); }
  .welcome .ctas { display:flex; gap:.9rem; align-items:center; margin-top:1.1rem; flex-wrap:wrap; }
  .welcome .ctas a + a { color:var(--accent); font-size:.9rem; }
  .welcome .meta { margin:.9rem 0 0; }
  .dtable { border-collapse:collapse; margin:.75rem 0 1rem; font-size:.85rem; width:100%; }
  .dtable td { padding:.3rem .6rem; border-bottom:1px solid #262626; vertical-align:top; }
  .dtable td:first-child { color:var(--mut); white-space:nowrap; width:11rem; }
  .dtable td:last-child { color:var(--txt); word-break:break-all; }
  /* compare mode */
  .cmpbar { display:flex; align-items:center; gap:.5rem; margin-bottom:.75rem; }
  .cmpbar button { background:#0d0d0d; color:var(--mut); border:1px solid var(--border);
                   border-radius:6px; padding:.25rem .6rem; cursor:pointer; font-size:.78rem; }
  .cmpbar button.active { color:#111; background:var(--accent); border-color:var(--accent); }
  .cmpbar .hint { color:var(--mut); font-size:.75rem; }
  body.comparing #list .item .cmpbox { display:inline-block; }
  .cmpbox { display:none; width:15px; height:15px; accent-color:var(--accent); cursor:pointer; flex:none; }
  .cmpstack .card { margin-bottom:2rem; }
  .cmpstack .card h2 { font-size:1.05rem; }
  .cmpstack.side .cards2 { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
  .cmpstack.side .cards2 .card { margin-bottom:0; }
  @media (max-width:1100px){
    .cmpstack.side .cards2 { grid-template-columns:1fr; max-height:none; overflow:visible; padding-right:0; }
    #cmp-side { display:none !important; }
  }
  .cmptag { display:inline-block; background:var(--accent); color:#111; border-radius:4px;
            font-size:.7rem; font-weight:700; padding:.05rem .4rem; margin-left:.4rem; vertical-align:middle; }
  .cmptag.a { background:#5f5; } .cmptag.b { background:#f7f; }
  @media (max-width:800px){ body{flex-direction:column} aside{position:static;width:100%;height:auto;border-right:0;border-bottom:1px solid var(--border)} }
</style>
</head>
<body>
<aside>
  <h1>🛹 skateboarder</h1>
  <div class="sub">LLM animated-SVG benchmark · <a style="color:var(--accent)" href="https://github.com/RisorseArtificiali/skateboarder">repo</a></div>
  <input id="search" type="search" placeholder="search model…" autocomplete="off">
  <div class="filters" id="run-filters">
    <button data-f="all" class="active">all</button>
    <button data-f="minimal">minimal</button>
    <button data-f="constrained">constrained</button>
    <button data-f="ok">ok</button>
    <button data-f="err">errors</button>
  </div>
  <div class="filters" id="ep-filters">
    <button data-ep="all" class="active">any endpoint</button>
    <button data-ep="openrouter">openrouter</button>
    <button data-ep="local">local/self-hosted</button>
  </div>
  <div class="cmpbar">
    <button id="cmp-toggle">compare</button>
    <button id="cmp-side" style="display:none" class="active">⬌ side by side</button>
    <span class="hint" id="cmp-hint"></span>
  </div>
  <div id="list"></div>
</aside>
<main>
  <div id="detail"><div class="card welcome"><h2>🛹 skateboarder</h2>
    <p class="tagline">When AI has to respect physics</p>
    <p class="lead">An animated-SVG benchmark for LLMs: one prompt, one skater, one half-pipe — can a model encode
    gravity and momentum in plain SVG? <a style="color:var(--accent)" href="https://github.com/RisorseArtificiali/skateboarder">GitHub repo</a></p>
  </div></div>
</main>
<script>
const state = {
  q:"", f:"all", ep:"all", entries:[], groups:[], selectedGroupId:null, loaded:false,
  activeRunByGroup:{}, comparing:false, pickedGroupIds:[], sideBySide:true
};
const PROMPTS = {};
const REASON_RANK = {default:100, max:90, xhigh:80, high:70, medium:60, low:50, minimal:40, disabled:20, unknown:10};

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function safeSvg(entry){
  const value = entry && entry.svg;
  return typeof value === "string" && !value.includes("..") && /^results\/[A-Za-z0-9._/-]+\.svg$/.test(value) ? value : null;
}

function reasonKey(entry){
  const reasoning = entry.reasoning || {};
  if (reasoning.requested === "effort") return reasoning.effort || "unknown";
  return reasoning.requested || "unknown";
}

function reasonLabel(entry){
  const reasoning = entry.reasoning || {};
  if (reasoning.requested === "disabled") return "no reasoning";
  if (reasoning.requested === "effort") return reasoning.effort || "unknown";
  if (reasoning.requested === "default") return "default";
  return "unknown";
}

function entryRank(entry){ return REASON_RANK[reasonKey(entry)] || 0; }

function makeGroups(entries){
  const byId = new Map();
  for (const entry of entries){
    const id = entry.group_id || entry.id;
    if (!byId.has(id)) byId.set(id, {id, entries:[]});
    byId.get(id).entries.push(entry);
  }
  const groups = [...byId.values()];
  for (const group of groups){
    group.entries.sort((a,b)=> entryRank(b)-entryRank(a) || String(b.timestamp||"").localeCompare(String(a.timestamp||"")) || a.id.localeCompare(b.id));
    const current = state.activeRunByGroup[group.id];
    if (!group.entries.some(entry=>entry.id===current)) state.activeRunByGroup[group.id] = group.entries[0].id;
  }
  return groups.sort((a,b)=>a.entries[0].id.localeCompare(b.entries[0].id));
}

function groupById(id){ return state.groups.find(group=>group.id===id); }

function activeEntry(group){
  return group && (group.entries.find(entry=>entry.id===state.activeRunByGroup[group.id]) || group.entries[0]);
}

function selectedGroups(){ return state.pickedGroupIds.map(groupById).filter(Boolean); }

async function fetchOk(url, kind){
  const response = await fetch(url);
  if (!response.ok) throw new Error(`${kind} request failed: HTTP ${response.status}`);
  return response;
}

async function boot(){
  const idx = await fetchOk("results/index.json", "index").then(response=>response.json());
  state.entries = Array.isArray(idx.entries) ? idx.entries : [];
  state.groups = makeGroups(state.entries);
  state.loaded = true;
  renderList();
  updateWelcomeStats();
  await Promise.all(["minimal","constrained"].map(async variant=>{
    try {
      PROMPTS[variant] = await fetchOk(`prompts/${variant}.txt`, `${variant} prompt`).then(response=>response.text());
    } catch (error) {
      PROMPTS[variant] = "";
      console.warn(error);
    }
  }));
  renderPromptBlock();
}

function detailsShell(){
  return `<details class="prompts"><summary>Show details</summary><div id="run-details"></div><div id="prompt-block"></div></details>`;
}

function welcomeHtml(){
  return `<div class="card welcome">
    <h2>🛹 skateboarder</h2>
    <p class="tagline">When AI has to respect physics</p>
    <p class="lead">One prompt, one animated SVG: a skater dropping into a half-pipe, pumping the transitions and
    flying out of the coping — written from scratch by a language model, in plain SVG with SMIL or CSS animation,
    no JavaScript. The question this benchmark asks: can an LLM encode gravity, momentum and pendulum motion in
    code it invents on the spot?</p>
    <p>Two prompt variants, always sent verbatim — typos included:</p>
    <ul class="plist">
      <li><b>minimal</b> — the original one-liner: <i>"generate an animated svg of a man doing skatevoard tricks on a pipe. Be mindful of the real phisics"</i></li>
      <li><b>constrained</b> — the full spec: half-pipe scene, skater and board anatomy, pendulum motion along the curve, parabolic aerials, board spin, seamless loop.</li>
    </ul>
    <p>Results are judged by physics, not by size: does the skater accelerate downhill and slow down uphill, are
    the aerials parabolic, the loop seamless, the anatomy human? Any OpenAI-compatible endpoint can join —
    OpenRouter or a local llama.cpp / ollama / vLLM server — so hosted frontier models and self-hosted open
    weights ride the same pipe. Run the benchmark on your model and open a PR: your SVG and its metadata become
    part of the gallery.</p>
    <div class="ctas">
      <a class="openbtn" href="https://github.com/RisorseArtificiali/skateboarder" target="_blank" rel="noopener">GitHub repo ↗</a>
      <a href="https://artificialcode.substack.com/p/from-the-pelican-to-the-skateboarder" target="_blank" rel="noopener">from the pelican to the skateboarder — the story ↗</a>
    </div>
    <p class="meta" id="welcome-stats">loading the gallery…</p>
  </div>
  <details class="prompts"><summary>Show the prompts</summary><div id="prompt-block"></div></details>`;
}

function renderWelcome(){
  state.selectedGroupId = null;
  document.body.classList.remove("comparing");
  document.getElementById("cmp-toggle").classList.remove("active");
  document.getElementById("cmp-side").style.display = "none";
  document.getElementById("detail").innerHTML = welcomeHtml();
  renderList();
  renderPromptBlock();
  updateWelcomeStats();
}

function updateWelcomeStats(){
  const element = document.getElementById("welcome-stats");
  if (!element) return;
  if (!state.loaded){ return; }
  if (!state.groups.length){
    element.textContent = "the gallery is empty — be the first to submit a run";
    return;
  }
  const models = `${state.groups.length} ${state.groups.length===1 ? "model" : "models"}`;
  const runs = `${state.entries.length} ${state.entries.length===1 ? "run" : "runs"}`;
  element.textContent = `pick a model in the sidebar to browse the gallery · ${models} · ${runs}`;
}

function renderPromptBlock(){
  const element = document.getElementById("prompt-block");
  if (!element) return;
  const entries = state.comparing
    ? selectedGroups().map(activeEntry).filter(Boolean)
    : [activeEntry(groupById(state.selectedGroupId))].filter(Boolean);
  let variants = [...new Set(entries.map(entry=>entry.prompt).filter(Boolean))];
  if (!variants.length) variants = ["minimal","constrained"].filter(variant=>PROMPTS[variant]);
  element.innerHTML = variants.length
    ? variants.map(variant=>`<p><b>Prompt - ${esc(variant)}</b> (verbatim, typos included)</p><pre>${esc(PROMPTS[variant]||"")}</pre>`).join("")
    : `<p class="meta">select a model to see the prompt used</p>`;
}

function epKind(entry){
  const endpoint = entry.endpoint || "";
  if (!endpoint) return "other";
  if (endpoint.includes("openrouter.ai")) return "openrouter";
  try {
    const host = new URL(endpoint).hostname;
    if (host === "localhost" || host === "127.0.0.1" || host === "::1" || host.endsWith(".local")
        || /^10\./.test(host) || /^192\.168\./.test(host) || /^172\.(1[6-9]|2\d|3[01])\./.test(host)) return "local";
  } catch (_) {}
  return "other";
}

function visible(){
  return state.groups.filter(group=>{
    const entry = activeEntry(group);
    if (state.f==="minimal" && entry.prompt!=="minimal") return false;
    if (state.f==="constrained" && entry.prompt!=="constrained") return false;
    if (state.f==="ok" && entryFailed(entry)) return false;
    if (state.f==="err" && !entryFailed(entry)) return false;
    if (state.ep!=="all" && epKind(entry)!==state.ep) return false;
    if (state.q) {
      const haystack = [group.id, ...group.entries.flatMap(item=>[item.id,item.model])].filter(Boolean).join(" ").toLowerCase();
      if (!haystack.includes(state.q)) return false;
    }
    return true;
  });
}

function entryFailed(entry){ return Boolean(entry.error || !safeSvg(entry)); }

function renderList(){
  const list = document.getElementById("list");
  const groups = visible();
  list.innerHTML = groups.length ? "" : "<div class='item'><span class='err'>no matches</span></div>";
  for (const group of groups){
    const entry = activeEntry(group);
    const item = document.createElement("div");
    item.className = "item" + (state.selectedGroupId===group.id && !state.comparing ? " sel" : "");
    item.dataset.groupId = group.id;
    const status = entryFailed(entry)
      ? `<span class="err">err</span>`
      : `<span class="ok">${Number.isFinite(+entry.svg_len) ? (+entry.svg_len/1024).toFixed(1)+"kB" : "ok"}</span>`;
    const modes = group.entries.length > 1 ? `<span class="modecount">${group.entries.length} modes</span>` : "";
    item.innerHTML = `<input type="checkbox" class="cmpbox" data-group-id="${esc(group.id)}" ${state.pickedGroupIds.includes(group.id)?"checked":""} title="pick for compare">` +
      `<span>${esc(entry.model || group.id)}${entry.prompt ? ` · ${esc(entry.prompt)}` : ""}</span>${modes}${status}`;
    item.querySelector(".cmpbox").onclick = event=>{
      event.stopPropagation();
      togglePick(group, event.target.checked);
    };
    item.onclick = ()=>state.comparing ? togglePick(group, !state.pickedGroupIds.includes(group.id)) : renderSingle(group);
    list.appendChild(item);
  }
  syncCmpBoxes();
}

function togglePick(group, on){
  const index = state.pickedGroupIds.indexOf(group.id);
  if (on && index<0) state.pickedGroupIds.push(group.id);
  if (!on && index>=0) state.pickedGroupIds.splice(index,1);
  renderList();
  renderCompare();
}

function syncCmpBoxes(){
  document.querySelectorAll("#list .cmpbox").forEach(box=>box.checked=state.pickedGroupIds.includes(box.dataset.groupId));
  const count = state.pickedGroupIds.length;
  document.getElementById("cmp-hint").textContent = !state.comparing ? "" :
    count===0 ? "pick models to compare" : count===1 ? "pick 1 more" :
    count===2 ? "2 picked" : `${count} picked - stacked view`;
}

function reasonControl(group){
  const selectedId = activeEntry(group).id;
  if (group.entries.length < 2) return `<span class="reasonpill">${esc(reasonLabel(activeEntry(group)))}</span>`;
  const counts = {};
  for (const entry of group.entries) counts[reasonLabel(entry)] = (counts[reasonLabel(entry)]||0)+1;
  const seen = {};
  const options = group.entries.map(entry=>{
    const base = reasonLabel(entry);
    seen[base] = (seen[base]||0)+1;
    const label = counts[base] > 1 ? `${base} (${seen[base]})` : base;
    return `<option value="${esc(entry.id)}" ${entry.id===selectedId?"selected":""}>${esc(label)}</option>`;
  }).join("");
  return `<select class="reason-select" data-group-id="${esc(group.id)}" aria-label="reasoning variant">${options}</select>`;
}

function contribLink(name){
  const value = String(name);
  const url = value === "maeste" ? "https://maeste.it" : `https://github.com/${encodeURIComponent(value)}`;
  return `<a href="${esc(url)}" target="_blank" rel="noopener" style="color:inherit">${esc(value)}</a>`;
}

function fmt(entry){
  const usage = entry.usage || {};
  const cost = entry.cost_usd!=null ? ` · $${(+entry.cost_usd).toFixed(entry.cost_usd<0.01?4:2)}` : "";
  const tokens = usage.total_tokens!=null ? ` · ${esc(usage.total_tokens)} tok` : "";
  const reasoningTokens = entry.reasoning_tokens!=null ? ` (${esc(entry.reasoning_tokens)} reasoning)` : "";
  const seconds = entry.seconds!=null ? ` · ${esc(entry.seconds)}s` : "";
  const contributor = entry.contributor ? ` · by ${contribLink(entry.contributor)}` : "";
  return `${esc(entry.model||entry.id)} · <b>${esc(entry.prompt||"?")}</b> · reasoning: ${esc(reasonLabel(entry))}${tokens}${reasoningTokens}${seconds}${cost}${contributor}`;
}

function keyValues(value){
  if (!value || typeof value!=="object") return value;
  return Object.entries(value).map(([key,item])=>`${key}=${typeof item==="object" ? JSON.stringify(item) : item}`).join(", ");
}

function advertisedDefault(entry){
  const provider = (entry.reasoning||{}).provider_default;
  if (!provider) return null;
  if (provider.supported===false) return "not supported";
  return [provider.enabled==null ? null : (provider.enabled ? "enabled" : "disabled"), provider.effort, provider.mandatory ? "mandatory" : null].filter(Boolean).join(", ") || "supported";
}

function detailsTable(entry){
  const usage = entry.usage || {};
  const completion = usage.completion_tokens_details || {};
  const row = (key,value,raw=false)=> value==null || value==="" ? "" : `<tr><td>${esc(key)}</td><td>${raw?value:esc(value)}</td></tr>`;
  return `<table class="dtable">
    ${row("model", entry.model)}
    ${row("variant", entry.prompt)}
    ${row("requested reasoning", reasonLabel(entry))}
    ${row("advertised provider default", advertisedDefault(entry))}
    ${row("contributor", entry.contributor ? contribLink(entry.contributor) : null, true)}
    ${row("endpoint", entry.endpoint)}
    ${row("timestamp", entry.timestamp)}
    ${row("svg size", entry.svg_len!=null ? entry.svg_len+" B" : null)}
    ${row("animation", entry.has_animation==null ? null : (entry.has_animation ? "yes" : "no"))}
    ${row("javascript", entry.uses_js==null ? null : (entry.uses_js ? "yes (violates rules)" : "no"))}
    ${row("prompt tokens", usage.prompt_tokens)}
    ${row("completion tokens", usage.completion_tokens)}
    ${row("reasoning tokens", entry.reasoning_tokens ?? completion.reasoning_tokens)}
    ${row("total tokens", usage.total_tokens)}
    ${row("cost", entry.cost_usd!=null ? "$"+(+entry.cost_usd).toFixed(entry.cost_usd<0.01?4:2) : null)}
    ${row("duration", entry.seconds!=null ? entry.seconds+" s" : null)}
    ${row("finish reason", entry.finish_reason)}
    ${row("params", keyValues(entry.params))}
    ${row("hardware", keyValues(entry.hardware))}
    ${row("engine", entry.engine ? [entry.engine.name,entry.engine.version].filter(Boolean).join(" ") : null)}
    ${row("quantization", entry.quantization)}
    ${row("notes", entry.note)}
    ${row("error", entry.error)}
  </table>`;
}

function runBody(entry){
  const svg = safeSvg(entry);
  if (entry.error || !svg) return `<div class="errorbox">ERROR: ${esc(entry.error||"no SVG")}${entry.finish_reason?` (finish: ${esc(entry.finish_reason)})`:""}</div>`;
  return `<div class="svgwrap"><iframe sandbox src="${esc(svg)}" loading="lazy"></iframe></div>
    <div class="actions"><a class="openbtn" href="${esc(svg)}" target="_blank" rel="noopener">Open raw SVG</a></div>`;
}

function runCard(group, tag=""){
  const entry = activeEntry(group);
  return `<div class="card" data-group-id="${esc(group.id)}"><h2>${esc(entry.id)}${tag}</h2><p class="meta">${fmt(entry)}</p>
    <div class="reasonbar"><span>reasoning</span>${reasonControl(group)}</div>${runBody(entry)}</div>`;
}

function renderSingle(group){
  document.body.classList.remove("comparing");
  document.getElementById("cmp-toggle").classList.remove("active");
  document.getElementById("cmp-side").style.display = "none";
  if (!group){
    state.selectedGroupId = null;
    document.getElementById("detail").innerHTML = `<div class="card"><h2>no results available</h2></div>`;
    renderList();
    return;
  }
  state.selectedGroupId = group.id;
  document.getElementById("detail").innerHTML = runCard(group) + detailsShell();
  document.getElementById("run-details").innerHTML = detailsTable(activeEntry(group));
  renderPromptBlock();
  renderList();
}

function renderCompareDetails(groups){
  const tags = [..."abcdefghijklmnopqrstuvwxyz"];
  document.getElementById("run-details").innerHTML = groups.map((group,index)=>{
    const letter = tags[index] || String(index+1);
    const entry = activeEntry(group);
    return `<p><b>Run ${esc(letter.toUpperCase())} - ${esc(entry.id)}</b></p>${detailsTable(entry)}`;
  }).join("");
}

function updateCompareGroup(group){
  const groups = selectedGroups();
  const index = groups.findIndex(item=>item.id===group.id);
  if (index<0) return;
  const tags = [..."abcdefghijklmnopqrstuvwxyz"];
  const letter = tags[index] || String(index+1);
  const card = [...document.querySelectorAll("#detail .card[data-group-id]")].find(item=>item.dataset.groupId===group.id);
  if (card){
    const holder = document.createElement("div");
    holder.innerHTML = runCard(group, `<span class="cmptag ${esc(letter)}">${esc(letter.toUpperCase())}</span>`);
    card.replaceWith(holder.firstElementChild);
  }
  renderCompareDetails(groups);
  renderPromptBlock();
}

function renderCompare(){
  document.getElementById("cmp-toggle").classList.toggle("active", state.comparing);
  document.body.classList.toggle("comparing", state.comparing);
  const groups = selectedGroups();
  const twoPicked = state.comparing && groups.length===2;
  document.getElementById("cmp-side").style.display = twoPicked ? "" : "none";
  document.getElementById("cmp-side").classList.toggle("active", state.sideBySide);
  syncCmpBoxes();
  if (!state.comparing) return;

  const tags = [..."abcdefghijklmnopqrstuvwxyz"];
  const canSide = state.sideBySide && groups.length===2;
  const cards = groups.length ? groups.map((group,index)=>{
    const letter = tags[index] || String(index+1);
    return runCard(group, `<span class="cmptag ${esc(letter)}">${esc(letter.toUpperCase())}</span>`);
  }).join("") : `<div class="card"><h2>compare mode</h2><p class="meta">pick models in the sidebar to compare their SVGs</p></div>`;
  const stack = `<div class="cmpstack${canSide?" side":""}">${canSide?`<div class="cards2">${cards}</div>`:cards}</div>`;
  document.getElementById("detail").innerHTML = stack + detailsShell();
  renderCompareDetails(groups);
  renderPromptBlock();
}

document.addEventListener("change", event=>{
  const select = event.target.closest(".reason-select");
  if (!select) return;
  const group = groupById(select.dataset.groupId);
  if (!group || !group.entries.some(entry=>entry.id===select.value)) return;
  state.activeRunByGroup[group.id] = select.value;
  renderList();
  if (state.comparing) updateCompareGroup(group); else renderSingle(group);
});

document.getElementById("cmp-toggle").onclick = ()=>{
  state.comparing = !state.comparing;
  if (!state.comparing){
    state.pickedGroupIds = [];
    const group = groupById(state.selectedGroupId);
    if (group) renderSingle(group); else renderWelcome();
  } else {
    renderList();
    renderCompare();
    if (window.innerWidth>800) document.querySelector("main").scrollIntoView({behavior:"smooth"});
  }
};

document.getElementById("cmp-side").onclick = ()=>{
  state.sideBySide = !state.sideBySide;
  renderCompare();
};

document.getElementById("search").addEventListener("input", event=>{
  state.q = event.target.value.toLowerCase();
  renderList();
});

document.querySelectorAll("#run-filters button").forEach(button=>button.onclick=()=>{
  document.querySelectorAll("#run-filters button").forEach(item=>item.classList.remove("active"));
  button.classList.add("active");
  state.f = button.dataset.f;
  renderList();
});

document.querySelectorAll("#ep-filters button").forEach(button=>button.onclick=()=>{
  document.querySelectorAll("#ep-filters button").forEach(item=>item.classList.remove("active"));
  button.classList.add("active");
  state.ep = button.dataset.ep;
  renderList();
});

renderWelcome();
boot().catch(error=>{
  document.getElementById("detail").innerHTML = `<div class="card"><h2>could not load results</h2><div class="errorbox">${esc(error.message)}</div></div>`;
});
</script>
</body>
</html>
