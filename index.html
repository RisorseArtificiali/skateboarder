<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skateboarder — LLM animated SVG benchmark</title>
<style>
  :root { --bg:#111; --card:#1c1c1c; --border:#333; --accent:#ffd700; --txt:#ddd; --mut:#888; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:16px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;
         display:flex; min-height:100vh; }
  aside { width:300px; min-width:260px; background:#161616; border-right:1px solid var(--border);
          padding:1.25rem; position:sticky; top:0; height:100vh; overflow-y:auto; }
  aside h1 { font-size:1.15rem; color:var(--accent); margin:0 0 .25rem; }
  aside .sub { color:var(--mut); font-size:.8rem; margin-bottom:1rem; }
  #search { width:100%; background:#0d0d0d; border:1px solid var(--border); color:var(--txt);
            border-radius:8px; padding:.5rem .75rem; font-size:.9rem; margin-bottom:.5rem; }
  #search:focus { outline:none; border-color:var(--accent); }
  .filters { display:flex; gap:.4rem; margin-bottom:1rem; flex-wrap:wrap; }
  .filters button { background:#0d0d0d; color:var(--mut); border:1px solid var(--border);
                    border-radius:6px; padding:.25rem .6rem; cursor:pointer; font-size:.78rem; }
  .filters button.active { color:#111; background:var(--accent); border-color:var(--accent); }
  #list .item { padding:.5rem .6rem; border-radius:8px; cursor:pointer; font-size:.85rem;
                display:flex; justify-content:space-between; gap:.5rem; align-items:center; }
  #list .item:hover { background:#222; }
  #list .item.sel { background:var(--accent); color:#111; }
  #list .item .err { color:#ff5555; font-size:.75rem; }
  #list .item .ok { color:#5f5; font-size:.75rem; }
  main { flex:1; padding:2rem; max-width:1000px; }
  body.comparing main { max-width:none; padding-right:1.5rem; }
  .cmpstack.side { position:relative; }
  .cmpstack.side .cards2 { max-height:calc(100vh - 4rem); overflow-y:auto; padding-right:.5rem; }
  .cmpstack.side .cards2 .svgwrap iframe { height:480px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.25rem; }
  .card h2 { color:var(--accent); margin:0 0 .25rem; font-size:1.2rem; }
  .meta { color:var(--mut); font-size:.85rem; margin:.25rem 0 1rem; }
  .meta b { color:var(--txt); font-weight:600; }
  .svgwrap { background:#000; border-radius:8px; overflow:hidden; }
  .svgwrap iframe { width:100%; height:480px; border:0; background:#000; }
  .actions { margin-top:1rem; display:flex; gap:.6rem; }
  .openbtn { display:inline-block; background:var(--accent); color:#111; padding:.35rem .9rem;
             border-radius:6px; text-decoration:none; font-size:.85rem; font-weight:600; }
  .openbtn:hover { background:#ffe44d; }
  .errorbox { color:#ff5555; background:#2a1515; border:1px solid #552222; border-radius:8px; padding:1rem; }
  .prompts summary { color:var(--accent); cursor:pointer; margin-top:1.5rem; }
  .prompts pre { white-space:pre-wrap; color:#bbb; font-size:.8rem; background:var(--card);
                 border:1px solid var(--border); border-radius:8px; padding:.75rem; }
  .dtable { border-collapse:collapse; margin:.75rem 0 1rem; font-size:.85rem; width:100%; }
  .dtable td { padding:.3rem .6rem; border-bottom:1px solid #262626; vertical-align:top; }
  .dtable td:first-child { color:var(--mut); white-space:nowrap; width:11rem; }
  .dtable td:last-child { color:var(--txt); word-break:break-all; }
  /* compare mode */
  .cmpbar { display:flex; align-items:center; gap:.5rem; margin-bottom:.75rem; }
  .cmpbar button { background:#0d0d0d; color:var(--mut); border:1px solid var(--border);
                   border-radius:6px; padding:.25rem .6rem; cursor:pointer; font-size:.78rem; }
  .cmpbar button.active { color:#111; background:var(--accent); border-color:var(--accent); }
  .cmpbar .hint { color:var(--mut); font-size:.75rem; }
  body.comparing #list .item .cmpbox { display:inline-block; }
  .cmpbox { display:none; width:15px; height:15px; accent-color:var(--accent); cursor:pointer; flex:none; }
  .cmpstack .card { margin-bottom:2rem; }
  .cmpstack .card h2 { font-size:1.05rem; }
  .cmpstack.side .cards2 { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
  .cmpstack.side .cards2 .card { margin-bottom:0; }
  @media (max-width:1100px){ .cmpstack.side .cards2 { grid-template-columns:1fr; } }
  .cmptag { display:inline-block; background:var(--accent); color:#111; border-radius:4px;
            font-size:.7rem; font-weight:700; padding:.05rem .4rem; margin-left:.4rem; vertical-align:middle; }
  .cmptag.a { background:#5f5; } .cmptag.b { background:#f7f; }
  @media (max-width:800px){ body{flex-direction:column} aside{position:static;width:100%;height:auto;border-right:0;border-bottom:1px solid var(--border)} }
</style>
</head>
<body>
<aside>
  <h1>🛹 skateboarder</h1>
  <div class="sub">LLM animated-SVG benchmark · <a style="color:var(--accent)" href="https://github.com/RisorseArtificiali/skateboarder">repo</a></div>
  <input id="search" type="search" placeholder="search model…" autocomplete="off">
  <div class="filters">
    <button data-f="all" class="active">all</button>
    <button data-f="minimal">minimal</button>
    <button data-f="constrained">constrained</button>
    <button data-f="ok">ok</button>
    <button data-f="err">errors</button>
  </div>
  <div class="filters" id="ep-filters">
    <button data-ep="all" class="active">any endpoint</button>
    <button data-ep="openrouter">openrouter</button>
    <button data-ep="local">local/self-hosted</button>
  </div>
  <div class="cmpbar">
    <button id="cmp-toggle">compare</button>
    <button id="cmp-side" style="display:none" class="active">⬌ side by side</button>
    <span class="hint" id="cmp-hint"></span>
  </div>
  <div id="list"></div>
</aside>
<main>
  <div id="detail"><div class="card"><h2>select a model from the sidebar</h2>
    <p class="meta">results are loaded from <code>results/index.json</code></p></div>
  <details class="prompts"><summary>Show details</summary>
    <div id="run-details"><p class="meta">select a model to see its run details</p></div>
    <div id="prompt-block"></div>
  </details></div>
</main>
<script>
const state = { q:"", f:"all", ep:"all", entries:[], comparing:false, picked:[], sideBySide:true };
const PROMPTS = {};  // variant -> verbatim text, fetched at boot

async function boot(){
  const idx = await fetch("results/index.json").then(r=>r.json());
  state.entries = idx.entries;
  for (const v of ["minimal","constrained"]){
    PROMPTS[v] = await fetch(`prompts/${v}.txt`).then(r=>r.text());
  }
  renderPromptBlock();
  renderList();
}

// Show only the prompt(s) actually used: one in single view; in compare,
// both, but each only once even when the two runs share a variant.
function renderPromptBlock(){
  const el = document.getElementById("prompt-block");
  let variants;
  if (state.comparing && state.picked.length){
    variants = [...new Set(state.picked.map(e=>e.prompt).filter(Boolean))];
  } else {
    const cur = state.entries.find(e=>e.id===document.querySelector("#list .item.sel")?.dataset.id);
    variants = cur && cur.prompt ? [cur.prompt] : [];
  }
  el.innerHTML = variants.length
    ? variants.map(v=>`<p><b>Prompt — ${v}</b> (verbatim, typos included)</p><pre>${PROMPTS[v]||""}</pre>`).join("")
    : `<p class="meta">select a model to see the prompt used</p>`;
}

// Endpoint category of a run: "openrouter" (the public gateway), "local"
// (any self-hosted endpoint: localhost, private LAN IPs, .local hostnames),
// or "other" (any other cloud gateway). Missing endpoint = legacy run.
function epKind(e){
  const ep = e.endpoint || "";
  if (!ep) return "other";
  if (ep.includes("openrouter.ai")) return "openrouter";
  try {
    const h = new URL(ep).hostname;
    if (h === "localhost" || h === "127.0.0.1" || h === "::1" || h.endsWith(".local")
        || /^10\./.test(h) || /^192\.168\./.test(h) || /^172\.(1[6-9]|2\d|3[01])\./.test(h))
      return "local";
  } catch (_) {}
  return "other";
}

function visible(){
  return state.entries.filter(e=>{
    if (state.f==="minimal"&&e.prompt!=="minimal") return false;
    if (state.f==="constrained"&&e.prompt!=="constrained") return false;
    if (state.f==="ok"&&e.error) return false;
    if (state.f==="err"&&!e.error) return false;
    if (state.ep!=="all"&&epKind(e)!==state.ep) return false;
    if (state.q && !e.id.toLowerCase().includes(state.q)) return false;
    return true;
  });
}

function renderList(){
  const list = document.getElementById("list");
  const items = visible();
  list.innerHTML = items.length ? "" : "<div class='item'><span class='err'>no matches</span></div>";
  for (const e of items){
    const d = document.createElement("div");
    d.className = "item"; d.dataset.id = e.id;
    d.innerHTML = `<input type="checkbox" class="cmpbox" data-id="${e.id}" ${state.picked.some(p=>p.id===e.id)?"checked":""} title="pick for compare">` +
      `<span>${e.id}</span>` + (e.error ? `<span class='err'>err</span>` : `<span class='ok'>${(e.svg_len/1024).toFixed(1)}kB</span>`);
    d.querySelector(".cmpbox").onclick = ev=>{
      ev.stopPropagation();
      togglePick(e, ev.target.checked);
    };
    d.onclick = ()=> state.comparing ? togglePick(e, true) : show(e);
    list.appendChild(d);
  }
}

function togglePick(e, on){
  const i = state.picked.findIndex(p=>p.id===e.id);
  if (on && i<0){
    state.picked.push(e);  // allow more than 2: layout goes stacked
  } else if (!on && i>=0) state.picked.splice(i,1);
  syncCmpBoxes();
  renderCompare();
}

function syncCmpBoxes(){
  document.querySelectorAll("#list .cmpbox").forEach(cb=>{
    cb.checked = state.picked.some(p=>p.id===cb.dataset.id);
  });
  const h = document.getElementById("cmp-hint");
  h.textContent = !state.comparing ? "" :
    state.picked.length===0 ? "pick 2 runs to compare side by side" :
    state.picked.length===1 ? "pick 1 more" :
    state.picked.length===2 ? "2 picked — side by side" :
    `${state.picked.length} picked — stacked view`;
}

function renderCompare(){
  const detail = document.getElementById("detail");
  const prompts = detail.querySelector(".prompts");
  document.getElementById("cmp-toggle").classList.toggle("active", state.comparing);
  const twoPicked = state.comparing && state.picked.length===2;
  document.getElementById("cmp-side").style.display = twoPicked ? "" : "none";
  document.getElementById("cmp-side").classList.toggle("active", state.sideBySide);
  document.body.classList.toggle("comparing", state.comparing);
  detail.querySelectorAll(".cmpstack").forEach(n=>n.remove());
  if (!state.comparing){ syncCmpBoxes(); return; }
  if (!state.picked.length){
    const s = document.createElement("div");
    s.className = "cmpstack";
    s.innerHTML = `<div class="card"><h2>compare mode</h2><p class="meta">tick two runs in the sidebar to see their SVGs stacked here</p></div>`;
    detail.insertBefore(s, prompts);
    return;
  }
  const tags = [..."abcdefghijklmnopqrstuvwxyz"];  // a, b, c, … for however many runs are picked
  const canSide = state.sideBySide && state.picked.length===2;
  const s = document.createElement("div");
  s.className = "cmpstack" + (canSide ? " side" : "");
  const cards = state.picked.map((e,i)=>{
    const tag = `<span class="cmptag ${tags[i]}">${tags[i].toUpperCase()}</span>`;
    const body = (e.error || !e.svg)
      ? `<div class="errorbox">ERROR: ${e.error||"no SVG"}${e.finish_reason?` (finish: ${e.finish_reason})`:''}</div>`
      : `<div class="svgwrap"><iframe src="${e.svg}" loading="lazy"></iframe></div>
         <div class="actions"><a class="openbtn" href="${e.svg}" target="_blank" rel="noopener">Open raw SVG ↗</a></div>`;
    return `<div class="card"><h2>${e.id}${tag}</h2><p class="meta">${fmt(e)}</p>${body}</div>`;
  }).join("");
  s.innerHTML = canSide ? `<div class="cards2">${cards}</div>` : cards;
  detail.insertBefore(s, prompts);
  document.getElementById("run-details").innerHTML =
    state.picked.map((e,i)=>`<p><b>Run ${tags[i].toUpperCase()} — ${e.id}</b></p>${detailsTable(e)}`).join("");
  renderPromptBlock();
}

document.getElementById("cmp-toggle").onclick = ()=>{
  state.comparing = !state.comparing;
  if (!state.comparing){
    state.picked = [];
    show(state.entries.find(e=>e.id===document.querySelector("#list .item.sel")?.dataset.id) || state.entries[0]);
  }
  syncCmpBoxes();
  renderCompare();
  if (state.comparing) detailTop();
  else document.querySelectorAll("#list .item").forEach(i=>i.classList.toggle("sel", i.dataset.id===(state.picked[0]||{}).id));
};
function detailTop(){ document.querySelector("main").scrollIntoView({behavior:"smooth"}); }
document.getElementById("cmp-side").onclick = ()=>{
  state.sideBySide = !state.sideBySide;
  renderCompare();
};

function contribLink(name){
  const safe = String(name).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const url = safe === "maeste" ? "https://maeste.it" : `https://github.com/${safe}`;
  return `<a href="${url}" target="_blank" rel="noopener" style="color:inherit">${safe}</a>`;
}

function fmt(e){
  const u = e.usage||{};
  const cost = e.cost_usd!=null ? ` · $${(+e.cost_usd).toFixed(e.cost_usd<0.01?4:2)}` : "";
  const tok = u.total_tokens!=null ? ` · ${u.total_tokens} tok` : "";
  const rs = e.reasoning_tokens ? ` (${e.reasoning_tokens} reasoning)` : "";
  const sec = e.seconds ? ` · ${e.seconds}s` : "";
  const who = e.contributor ? ` · by ${contribLink(e.contributor)}` : "";
  return `${e.model||e.id} · <b>${e.prompt||"?"}</b>${tok}${rs}${sec}${cost}${who}`;
}

function detailsTable(e){
  const u = e.usage||{};
  const row = (k,v)=> v==null||v==="" ? "" : `<tr><td>${k}</td><td>${v}</td></tr>`;
  const ct = u.completion_tokens_details||{};
  return `<table class="dtable">
    ${row("model", e.model)}
    ${row("variant", e.prompt)}
    ${row("contributor", e.contributor ? contribLink(e.contributor) : null)}
    ${row("endpoint", e.endpoint)}
    ${row("timestamp", e.timestamp)}
    ${row("svg size", e.svg_len!=null ? e.svg_len+" B" : null)}
    ${row("animation", e.has_animation==null ? null : (e.has_animation ? "yes" : "no"))}
    ${row("javascript", e.uses_js ? "yes (violates rules)" : "no")}
    ${row("prompt tokens", u.prompt_tokens)}
    ${row("completion tokens", u.completion_tokens)}
    ${row("reasoning tokens", e.reasoning_tokens || ct.reasoning_tokens)}
    ${row("total tokens", u.total_tokens)}
    ${row("cost", e.cost_usd!=null ? "$"+(+e.cost_usd).toFixed(e.cost_usd<0.01?4:2) : null)}
    ${row("duration", e.seconds ? e.seconds+" s" : null)}
    ${row("finish reason", e.finish_reason)}
    ${row("params", e.params ? Object.entries(e.params).map(([k,v])=>`${k}=${v}`).join(", ") : null)}
    ${row("error", e.error)}
  </table>`;
}

function show(e){
  document.querySelectorAll("#list .item").forEach(i=>i.classList.toggle("sel", i.dataset.id===e.id));
  const detail = document.getElementById("detail");
  const meta = `<div class="card"><h2>${e.id}</h2><p class="meta">${fmt(e)}</p>`;
  let body;
  if (e.error || !e.svg){
    body = `<div class="errorbox">ERROR: ${e.error||"no SVG"}${e.finish_reason?` (finish: ${e.finish_reason})`:''}</div>`;
  } else {
    body = `<div class="svgwrap"><iframe src="${e.svg}" loading="lazy"></iframe></div>
      <div class="actions"><a class="openbtn" href="${e.svg}" target="_blank" rel="noopener">Open raw SVG ↗</a></div>`;
  }
  detail.insertAdjacentHTML("afterbegin", meta+body+"</div>");
  detail.querySelector(".card:not(:first-of-type)")?.remove();
  // readable per-run details above the prompts in "Show details"
  document.getElementById("run-details").innerHTML = detailsTable(e);
  renderPromptBlock();
}

document.getElementById("search").addEventListener("input", ev=>{ state.q=ev.target.value.toLowerCase(); renderList(); });
document.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); state.f=b.dataset.f; renderList();
});
document.querySelectorAll("#ep-filters button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#ep-filters button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); state.ep=b.dataset.ep; renderList();
});
boot();
</script>
</body>
</html>
