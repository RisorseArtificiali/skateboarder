name: build index

on:
  push:
    branches: [main]
    paths: ["results/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 build_index.py
      - name: commit index
        run: |
          git config user.name "skateboarder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/index.json
          git diff --cached --quiet || git commit -m "rebuild index.json"
          git push
