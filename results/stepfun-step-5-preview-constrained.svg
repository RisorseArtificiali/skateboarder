<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Ramp and environment -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F7FA"/>
    </linearGradient>
    <linearGradient id="ramp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5D4037"/>
      <stop offset="100%" stop-color="#8D6E63"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#sky)"/>
  
  <!-- Ground -->
  <rect x="0" y="520" width="1000" height="80" fill="#4CAF50"/>
  
  <!-- Half-pipe ramp -->
  <g id="ramp">
    <path d="M 150 520 L 150 240 C 150 180, 200 120, 500 120 C 800 120, 850 180, 850 240 L 850 520" 
          fill="url(#ramp)" stroke="#3E2723" stroke-width="3"/>
    <!-- Coping edges -->
    <line x1="150" y1="240" x2="130" y2="240" stroke="#FFC107" stroke-width="6" stroke-linecap="round"/>
    <line x1="850" y1="240" x2="870" y2="240" stroke="#FFC107" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Animated skater and board group -->
  <g id="skater">
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="790,230; 790,230; 210,230; 210,230; 790,230" 
      keyTimes="0; 0.2; 0.5; 0.7; 1" 
      dur="8s" 
      repeatCount="indefinite"/>
    
    <!-- Aerial phase oscillation to simulate jump arc -->
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="0,0; 0,0; 0,-150; 0,-50; 0,0" 
      keyTimes="0; 0.75; 0.85; 0.95; 1" 
      dur="8s" 
      repeatCount="indefinite"
      additive="sum"/>

    <!-- Skateboard -->
    <g id="board">
      <!-- Board rotation during trick -->
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        values="0; 0; 360; 0; 0" 
        keyTimes="0; 0.8; 0.9; 0.95; 1" 
        dur="8s" 
        repeatCount="indefinite"/>
      
      <rect x="-30" y="-8" width="60" height="8" rx="4" fill="#FF5722" stroke="#BF360C" stroke-width="1.5"/>
      <!-- Trucks -->
      <rect x="-22" y="-6" width="8" height="4" fill="#616161"/>
      <rect x="14" y="-6" width="8" height="4" fill="#616161"/>
      <!-- Wheels -->
      <circle cx="-20" cy="4" r="4" fill="#212121" stroke="#FFF" stroke-width="1"/>
      <circle cx="20" cy="4" r="4" fill="#212121" stroke="#FFF" stroke-width="1"/>
      <circle cx="-24" cy="4" r="4" fill="#212121" stroke="#FFF" stroke-width="1"/>
      <circle cx="24" cy="4" r="4" fill="#212121" stroke="#FFF" stroke-width="1"/>
    </g>

    <!-- Skater figure -->
    <g id="body">
      <!-- Legs -->
      <line x1="-8" y1="-10" x2="-15" y2="-25" stroke="#1565C0" stroke-width="6" stroke-linecap="round"/>
      <line x1="8" y1="-10" x2="15" y2="-25" stroke="#1565C0" stroke-width="6" stroke-linecap="round"/>
      <!-- Torso -->
      <rect x="-8" y="-35" width="16" height="25" rx="4" fill="#E53935"/>
      <!-- Arms -->
      <line x1="-8" y1="-32" x2="-18" y2="-18" stroke="#E53935" stroke-width="4" stroke-linecap="round"/>
      <line x1="8" y1="-32" x2="18" y2="-18" stroke="#E53935" stroke-width="4" stroke-linecap="round"/>
      <!-- Head -->
      <circle cx="0" cy="-42" r="8" fill="#FFCCBC" stroke="#D84315" stroke-width="1.5"/>
      <!-- Cap -->
      <path d="M -8,-46 Q 0,-50 8,-46 L 8,-44 Q 0,-48 -8,-44 Z" fill="#37474F"/>
    </g>
  </g>
</svg>