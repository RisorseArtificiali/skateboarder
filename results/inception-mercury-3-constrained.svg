<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>

    <!-- Concrete ramp gradient -->
    <linearGradient id="rampGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6c757d"/>
      <stop offset="100%" stop-color="#343a40"/>
    </linearGradient>

    <!-- Metal coping gradient -->
    <radialGradient id="copingGrad" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#e9ecef"/>
      <stop offset="100%" stop-color="#495057"/>
    </radialGradient>
  </defs>

  <!-- Background sky -->
  <rect width="800" height="600" fill="url(#skyGrad)"/>

  <!-- Distant scenery / moon -->
  <circle cx="680" cy="90" r="45" fill="#f8f9fa" opacity="0.15"/>
  <circle cx="680" cy="90" r="35" fill="#0f0c29" opacity="0.15"/>

  <!-- Half-pipe concrete structure: two quarter pipes facing each other with a flat bottom -->
  <g id="halfpipe">
    <!-- Fill the solid ramp/deck area below the skating surface -->
    <path d="M 0 300 L 100 300 A 150 150 0 0 0 250 450 L 550 450 A 150 150 0 0 0 700 300 L 800 300 L 800 600 L 0 600 Z"
          fill="url(#rampGrad)" stroke="#1d2124" stroke-width="2"/>

    <!-- Surface lines: left quarter pipe, flat bottom, right quarter pipe -->
    <path d="M 250 450 A 150 150 0 0 1 100 300" fill="none" stroke="#adb5bd" stroke-width="4"/>
    <line x1="250" y1="450" x2="550" y2="450" stroke="#adb5bd" stroke-width="4"/>
    <path d="M 550 450 A 150 150 0 0 0 700 300" fill="none" stroke="#adb5bd" stroke-width="4"/>

    <!-- Deck edges/coping -->
    <line x1="0" y1="300" x2="100" y2="300" stroke="#868e96" stroke-width="5"/>
    <line x1="700" y1="300" x2="800" y2="300" stroke="#868e96" stroke-width="5"/>
    <circle cx="100" cy="300" r="8" fill="url(#copingGrad)" stroke="#212529" stroke-width="2"/>
    <circle cx="700" cy="300" r="8" fill="url(#copingGrad)" stroke="#212529" stroke-width="2"/>
  </g>

  <!-- Skater group: the whole group follows the half-pipe path, including the ballistic jump -->
  <g id="skater-motion">
    <!--
      Main path:
      - Starts at flat bottom center moving right.
      - Rides up the right quarter pipe, launches over the coping.
      - Performs an aerial arc, lands back on the right transition.
      - Roll across the flat bottom, up the left quarter pipe.
      - Small pop over the left coping, lands back down the left transition.
      - Returns to the starting point, seamlessly looping.
    -->
    <animateMotion
      path="M 400 450 L 550 450 A 150 150 0 0 0 700 300 C 700 180 740 271 679.9 375 A 150 150 0 0 1 550 450 L 250 450 A 150 150 0 0 1 100 300 C 80 220 50 290 143.9 406.1 A 150 150 0 0 0 250 450 L 400 450"
      dur="8s"
      repeatCount="indefinite"
      rotate="auto"
      calcMode="linear"
      keyTimes="0;0.04;0.085;0.13;0.18;0.225;0.25;0.31;0.34;0.36;0.38;0.43;0.49;0.56;0.63;0.69;0.72;0.75;0.81;0.84;0.9;0.94;1"
      keyPoints="0;0.083;0.1265;0.17;0.2134;0.2571;0.2653;0.3052;0.3684;0.3901;0.4117;0.4947;0.5777;0.6211;0.6646;0.708;0.735;0.7457;0.7842;0.8519;0.917;0.9585;1"
    />

    <g id="skater-figure">
      <!-- Skateboard group: board rotates 360° during the right-side aerial trick -->
      <g id="board">
        <animateTransform
          attributeName="transform"
          type="rotate"
          values="0 0 -12; 0 0 -12; 360 0 -12; 360 0 -12"
          keyTimes="0;0.18;0.34;1"
          dur="8s"
          repeatCount="indefinite"
        />

        <!-- Far side wheels -->
        <circle cx="-19" cy="-7" r="4.5" fill="#111"/>
        <circle cx="19" cy="-7" r="4.5" fill="#111"/>

        <!-- Trucks -->
        <path d="M -23 -8 L -13 -8 L -15 -14 L -21 -14 Z" fill="#616a6b"/>
        <path d="M 13 -8 L 23 -8 L 21 -14 L 15 -14 Z" fill="#616a6b"/>

        <!-- Near side wheels -->
        <circle cx="-18" cy="-5" r="4.5" fill="#495057"/>
        <circle cx="18" cy="-5" r="4.5" fill="#495057"/>

        <!-- Deck -->
        <path d="M -34 -13 Q -36 -16 -31 -16 L 31 -16 Q 36 -16 34 -13 L 34 -10 L -34 -10 Z"
              fill="#e07a5f" stroke="#212529" stroke-width="1.5"/>
      </g>

      <!-- Rider body: legs, torso, arms, head -->
      <g id="rider">
        <!-- Legs -->
        <path d="M -8 -15 L -6 -40 M 8 -15 L 6 -40" stroke="#2a9d8f" stroke-width="7" stroke-linecap="round" fill="none"/>
        <!-- Torso -->
        <line x1="-6" y1="-40" x2="0" y2="-70" stroke="#e76f51" stroke-width="9" stroke-linecap="round"/>
        <!-- Arms -->
        <line x1="-5" y1="-45" x2="-28" y2="-62" stroke="#f4a261" stroke-width="6" stroke-linecap="round"/>
        <line x1="5" y1="-45" x2="26" y2="-58" stroke="#f4a261" stroke-width="6" stroke-linecap="round"/>
        <!-- Head -->
        <circle cx="0" cy="-79" r="10" fill="#ffd6a5"/>
        <!-- Helmet -->
        <path d="M -10 -80 A 10 10 0 0 1 10 -80 L 7 -86 A 7 7 0 0 0 -7 -86 Z" fill="#e63946"/>
      </g>
    </g>
  </g>
</svg>