<svg id="skate-svg" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice">
        <defs>
            <!-- Gradient Background -->
            <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
            </linearGradient>
            
            <!-- Ramp Gradient -->
            <linearGradient id="rampGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#334155;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
            </linearGradient>

            <!-- Arrowheads for Vectors -->
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#fff" />
            </marker>
            <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444" />
            </marker>
            <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6" />
            </marker>
        </defs>

        <!-- Scene -->
        <rect width="1000" height="600" fill="url(#skyGrad)" />
        
        <!-- The Half Pipe -->
        <!-- We use a path to define the ramp shape. Physics uses coordinates to sample height/angle -->
        <path id="half-pipe-floor" d="M 100 400 Q 500 400 900 400 L 900 600 L 100 600 Z" fill="#0f172a" opacity="0.5" /> <!-- Shadow floor -->

        <!-- Vert Ramp Background -->
        <path d="M 50 600 L 50 350 Q 500 350 950 350 L 950 600 Z" fill="#1e293b" stroke="#475569" stroke-width="2" />
        
        <!-- Transition Ramp Surface (Visual) -->
        <!-- M 100 (left floor start) -> L 400 440 (flat start) -> Q 500 470 600 440 -> L 900 600 (copings) -->
        <path id="ramp-surface-path" d="M 100 600 L 100 500 Q 500 350 900 500 L 900 600" fill="url(#rampGrad)" stroke="#64748b" stroke-width="4" />
        
        <!-- Center Line for visual reference -->
        <line x1="500" y1="380" x2="500" y2="600" stroke="#ffffff" stroke-opacity="0.1" stroke-dasharray="5,5" />

        <!-- Target Arc (Trajectory Preview) -->
        <path id="trajectory-preview" d="" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,4" opacity="0.6" />

        <!-- Physics Overlay Group -->
        <g id="physics-layer">
            <!-- Force Vectors -->
            <line id="v-gravity" x1="0" y1="0" x2="0" y2="0" stroke="#ef4444" stroke-width="3" marker-end="url(#arrowhead-red)" />
            <text id="t-gravity" fill="#ef4444" font-size="10" x="0" y="0">g</text>
            
            <line id="v-velocity" x1="0" y1="0" x2="0" y2="0" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrowhead)" />
            <text id="t-velocity" fill="#fbbf24" font-size="10" x="0" y="0">v</text>
        </g>

        <!-- Character Group -->
        <g id="skater-group">
            <!-- Board -->
            <g id="board-group" transform="rotate(0)">
                <rect x="-40" y="0" width="80" height="8" rx="2" fill="#1f2937" stroke="#000" stroke-width="1"/>
                <circle cx="-25" cy="4" r="3" fill="#666"/> <!-- Back Wheel -->
                <circle cx="25" cy="4" r="3" fill="#666"/> <!-- Front Wheel -->
            </g>
            <!-- Body -->
            <g id="body-group" transform="translate(0, 0)">
                <!-- Legs -->
                <line id="leg-back" x1="0" y1="0" x2="10" y2="15" stroke="#1f2937" stroke-width="8" stroke-linecap="round"/>
                <line id="leg-front" x1="0" y1="0" x2="-10" y2="15" stroke="#1f2937" stroke-width="8" stroke-linecap="round"/>
                <!-- Torso -->
                <line id="torso" x1="0" y1="0" x2="0" y2="-35" stroke="#374151" stroke-width="10" stroke-linecap="round"/>
                <!-- Arms -->
                <line id="arm-back" x1="0" y1="-30" x2="20" y2="-10" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
                <line id="arm-front" x1="0" y1="-30" x2="-20" y2="-10" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
                <!-- Head -->
                <circle id="head" cx="0" cy="-45" r="8" fill="#fca5a5" /> <!-- Head -->
                <path d="M -8 -50 Q 0 -60 8 -50" fill="#000" /> <!-- Helmet -->
            </g>
        </g>
    </svg>