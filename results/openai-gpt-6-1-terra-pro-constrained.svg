<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
  <title id="title">Vert ramp aerial</title>
  <desc id="desc">A skateboarder swings between two quarter pipes and performs an aerial rotation above the right coping.</desc>

  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#1b2550"/>
      <stop offset="1" stop-color="#754e79"/>
    </linearGradient>
    <linearGradient id="ramp" x2="0" y2="1">
      <stop stop-color="#e2a66d"/>
      <stop offset="1" stop-color="#a65c48"/>
    </linearGradient>
    <linearGradient id="surface" x2="0" y2="1">
      <stop stop-color="#ffe0a3"/>
      <stop offset="1" stop-color="#e2a66d"/>
    </linearGradient>
  </defs>

  <!-- Evening sky and distant scenery -->
  <g>
    <rect width="960" height="580" fill="url(#sky)"/>
    <circle cx="126" cy="89" r="37" fill="#ffd6a0" opacity=".9"/>
    <g fill="#fff3da" opacity=".75">
      <circle cx="250" cy="76" r="2"/>
      <circle cx="405" cy="48" r="1.5"/>
      <circle cx="566" cy="96" r="2"/>
      <circle cx="710" cy="55" r="1.5"/>
      <circle cx="854" cy="107" r="2"/>
    </g>
    <path d="M0 350 L100 285 170 325 260 260 350 330 450 270 545 330 650 265 745 325 840 275 960 340 V580 H0Z"
          fill="#283454" opacity=".6"/>
    <path d="M0 405 Q140 350 280 405 T560 405 T840 405 T1120 405 V580 H0Z"
          fill="#222b49" opacity=".7"/>
  </g>

  <!-- The two facing quarter pipes, flat bottom, and solid ramp structure -->
  <g>
    <path d="M0 250 H180 C180 366 274 460 390 460 H570
             C686 460 780 366 780 250 H960 V580 H0Z"
          fill="url(#ramp)" stroke="#432f3b" stroke-width="5"/>
    <path d="M180 250 C180 366 274 460 390 460 H570
             C686 460 780 366 780 250"
          fill="none" stroke="url(#surface)" stroke-width="12"/>
    <path d="M180 250 C180 366 274 460 390 460 H570
             C686 460 780 366 780 250"
          fill="none" stroke="#754840" stroke-width="2"/>
    <path d="M0 250 H180 M780 250 H960" fill="none"
          stroke="#e8c59c" stroke-width="9"/>
    <path d="M0 257 H177 M783 257 H960" fill="none"
          stroke="#5c3b3e" stroke-width="4"/>
    <g fill="#dce9ed" stroke="#52606d" stroke-width="2">
      <circle cx="180" cy="250" r="6"/>
      <circle cx="780" cy="250" r="6"/>
    </g>
    <g fill="none" stroke="#774a43" stroke-width="3" opacity=".5">
      <path d="M92 266 V580 M868 266 V580"/>
      <path d="M230 382 L205 580 M315 444 L300 580"/>
      <path d="M645 444 L660 580 M730 382 L755 580"/>
      <path d="M390 468 V580 M570 468 V580"/>
    </g>
    <path d="M0 566 H960" stroke="#493843" stroke-width="7"/>
  </g>

  <!-- Motion follows the transitions, with vertical ballistic flights at the lips -->
  <g>
    <animateMotion
      dur="6.92s" repeatCount="indefinite"
      path="M769 250 L769 154 L769 250
            C769 360 680 449 570 449 L390 449
            C280 449 191 360 191 250
            L191 154 L191 250
            C191 360 280 449 390 449 L570 449
            C680 449 769 360 769 250"
      calcMode="spline"
      keyTimes="0;.101156;.202312;.323699;.377890;.499278;.600434;.701590;.822977;.877168;1"
      keyPoints="0;.04814;.09628;.25302;.34328;.50002;.54816;.59630;.75304;.84330;1"
      keySplines=".333 .667 .667 1;
                  .333 0 .667 .333;
                  .333 .246 .667 .570;
                  .333 .333 .667 .667;
                  .333 .430 .667 .754;
                  .333 .667 .667 1;
                  .333 0 .667 .333;
                  .333 .246 .667 .570;
                  .333 .333 .667 .667;
                  .333 .430 .667 .754"/>

    <!-- The rider and board bank with the ramp; a full rotation occurs in flight -->
    <g>
      <animateTransform
        attributeName="transform" type="rotate"
        dur="6.92s" repeatCount="indefinite"
        values="-90;90;270;360;360;450;450;450;360;360;270"
        keyTimes="0;.101156;.202312;.323699;.377890;.499278;.600434;.701590;.822977;.877168;1"
        calcMode="spline"
        keySplines=".333 .333 .667 .667;
                    .333 .333 .667 .667;
                    .333 0 .667 .333;
                    .333 .333 .667 .667;
                    .333 .667 .667 1;
                    .333 .333 .667 .667;
                    .333 .333 .667 .667;
                    .333 0 .667 .333;
                    .333 .333 .667 .667;
                    .333 .667 .667 1"/>

      <!-- Skater: bent legs, torso, arms, head and helmet -->
      <g stroke-linecap="round" stroke-linejoin="round">
        <path d="M-7 -36 L-16 -23 L-21 -8 M7 -36 L17 -23 L22 -8"
              fill="none" stroke="#202c40" stroke-width="11"/>
        <path d="M-25 -7 L-13 -7 M16 -7 L28 -7"
              fill="none" stroke="#f4eee5" stroke-width="6"/>
        <path d="M-10 -60 Q0 -66 10 -59 L13 -38 Q0 -32 -12 -38Z"
              fill="#f3b94f" stroke="#57404a" stroke-width="2"/>
        <path d="M-9 -57 L-23 -45 L-32 -49 M9 -57 L22 -48 L32 -53"
              fill="none" stroke="#efbd98" stroke-width="7"/>
        <circle cx="-32" cy="-49" r="4" fill="#efbd98"/>
        <circle cx="32" cy="-53" r="4" fill="#efbd98"/>
        <path d="M-8 -65 V-71 H8 V-65" fill="#efbd98"/>
        <circle cx="0" cy="-78" r="11" fill="#efbd98"/>
        <path d="M-11 -80 Q-11 -92 0 -92 Q11 -92 12 -80Z"
              fill="#64d1c5" stroke="#304d5a" stroke-width="2"/>
        <path d="M-11 -80 H13" stroke="#304d5a" stroke-width="2"/>
        <circle cx="4" cy="-77" r="1.3" fill="#49363a"/>
      </g>

      <!-- Skateboard deck, two trucks, and four visible wheels -->
      <g>
        <path d="M-38 -8 Q-35 -2 -29 -2 H29 Q35 -2 38 -8
                 Q36 -4 32 -4 H-32 Q-36 -4 -38 -8Z"
              fill="#56c6bc" stroke="#24434b" stroke-width="2"/>
        <path d="M-25 -2 V3 M25 -2 V3" stroke="#c8d7db" stroke-width="3"/>
        <path d="M-29 3 H-17 M17 3 H29" stroke="#53636e" stroke-width="2"/>
        <g fill="#f5dfb2" stroke="#35434d" stroke-width="1.5">
          <circle cx="-27" cy="6" r="3.3"/>
          <circle cx="-19" cy="6" r="3.3"/>
          <circle cx="19" cy="6" r="3.3"/>
          <circle cx="27" cy="6" r="3.3"/>
        </g>
      </g>
    </g>
  </g>
</svg>