<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" fill="#111"/>
  
  <!-- Half-pipe / vert ramp -->
  <g id="halfpipe">
    <!-- U-shaped ramp -->
    <path d="M 200,300 C 200,450 300,550 400,550 C 500,550 600,450 600,300" fill="#222" stroke="#555" stroke-width="30" stroke-linecap="round"/>
    <!-- Ride surface -->
    <path d="M 200,300 C 200,450 300,550 400,550 C 500,550 600,450 600,300" fill="none" stroke="#777" stroke-width="8" stroke-dasharray="15,15"/>
    <!-- Copings -->
    <rect x="180" y="270" width="60" height="25" rx="12" fill="#888"/>
    <rect x="540" y="270" width="60" height="25" rx="12" fill="#888"/>
  </g>
  
  <!-- Skater with pendulum motion and aerial trick -->
  <g id="skater">
    <!-- Skater movement: pendulum swing, launch, landing, loop -->
    <animateTransform attributeName="transform" type="Transform" 
      values="translate(200,300) rotate(0); translate(350,450) rotate(-20); translate(450,520) rotate(10); translate(550,450) rotate(-20); translate(600,300) rotate(0; translate(650,150) rotate(90; translate(200,300) rotate(0" 
      keyTimes="0; 0.2; 0.4; 0.6; 0.8; 0.9; 1" 
      dur="8s" repeatCount="indefinite" calcMode="linear"/>
    
    <!-- Skater body -->
    <circle cx="0" cy="-25" r="8" fill="#eee"/>
    <line x1="0" y1="-15" x2="0" y2="5" stroke="#333" stroke-width="4" stroke-linecap="round"/>
    <line x1="-5" y1="-5" x2="5" y2="-5" stroke="#333" stroke-width="4" stroke-linecap="round"/>
    <line x1="-5" y1="5" x2="-10" y2="15" stroke="#333" stroke-width="4" stroke-linecap="round"/>
    <line x1="5" y1="5" x2="10" y2="15" stroke="#333" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Skateboard with flip rotation -->
    <g id="board">
      <animateTransform attributeName="transform" type="Rotate" 
        values="0; 360; 360; 0; 0; 0" 
        keyTimes="0; 0.3; 0.5; 0.7; 0.9; 1" 
        dur="8s" repeatCount="indefinite" calcMode="linear"/>
      <!-- Deck -->
      <rect x="-25" y="-3" width="50" height="6" rx="2" fill="#e33" stroke="#000" stroke-width="1"/>
      <!-- Trucks -->
      <rect x="-6" y="-2" width="12" height="4" fill="#000"/>
      <!-- Wheels -->
      <circle cx="-20" cy="0" r="4" fill="#000"/>
      <circle cx="20" cy="0" r="4" fill="#000"/>
    </g>
  </g>
</svg>