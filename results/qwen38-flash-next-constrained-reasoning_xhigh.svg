<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63b9e8"/>
      <stop offset="1" stop-color="#d8f1ff"/>
    </linearGradient>
  </defs>

  <!-- Background sky -->
  <rect x="0" y="0" width="800" height="500" fill="url(#sky)"/>

  <!--
    Half-pipe / vert ramp:
    left quarter pipe, flat bottom, right quarter pipe, and coping dots.
    The visible surface matches the skater's wheel-contact path below.
  -->
  <g id="halfpipe">
    <path
      d="M60,254 L160,254 A120,120 0 0 0 280,374 L520,374 A120,120 0 0 0 640,254 L740,254 L740,450 L60,450 Z"
      fill="#263238" stroke="#000000" stroke-width="3"/>
    <path
      d="M160,254 A120,120 0 0 0 280,374 L520,374 A120,120 0 0 0 640,254"
      fill="none" stroke="#eceff1" stroke-width="5"/>
    <circle cx="160" cy="254" r="5" fill="#ffb74d"/>
    <circle cx="640" cy="254" r="5" fill="#ffb74d"/>
  </g>

  <!--
    Skater position group.

    The motion path is a physical pendulum-style loop:
      bottom -> right transition -> air above right coping ->
      right transition -> bottom -> left transition ->
      air above left coping -> left transition -> bottom.

    keyTimes are chosen so the skater is fastest near the bottom and
    slowest near the tops/airs. Air segments use deceleration then
    acceleration for vertical ballistic motion.
    keyPoints are distance fractions along the exact path length:
      4 quarter arcs + 3 flat segments + 4 vertical air segments.
  -->
  <g id="skaterMotion">
    <animateMotion
      dur="8.8s"
      repeatCount="indefinite"
      calcMode="spline"
      rotate="none"
      path="M400,374
            L520,374
            A120,120 0 0 0 640,254
            L640,134
            L640,254
            A120,120 0 0 1 520,374
            L280,374
            A120,120 0 0 1 160,254
            L160,134
            L160,254
            A120,120 0 0 0 280,374
            L400,374"
      keyTimes="0;0.0454545;0.125;0.25;0.375;0.4545455;0.5454545;0.625;0.75;0.875;0.9545455;1"
      keyPoints="0;0.0700124;0.1799876;0.25;0.3200124;0.4299876;0.5700124;0.6799876;0.75;0.8200124;0.9299876;1"
      keySplines="
        0 0 1 1;
        0.1 0.2 0.6 0.8;
        0.1 0.15 0.6 1;
        0.4 0 0.9 0.85;
        0.1 0.25 0.7 0.7;
        0 0 1 1;
        0.1 0.2 0.6 0.8;
        0.1 0.15 0.6 1;
        0.4 0 0.9 0.85;
        0.1 0.25 0.7 0.7;
        0 0 1 1
      "/>

    <!--
      Skater orientation group.
      The rotation values align the body/board with the ramp surface on
      transitions, upright during the highest part of the air, then align
      again before landing. Left wall uses positive tilt, right wall negative.
    -->
    <g id="skaterTilt">
      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="rotate"
        dur="8.8s"
        repeatCount="indefinite"
        calcMode="spline"
        keyTimes="0;0.0454545;0.125;0.25;0.375;0.4545455;0.5454545;0.625;0.75;0.875;0.9545455;1"
        values="
          0 0 0;
          0 0 0;
          -90 0 0;
          0 0 0;
          -90 0 0;
          0 0 0;
          0 0 0;
          90 0 0;
          0 0 0;
          90 0 0;
          0 0 0;
          0 0 0"
        keySplines="
          0 0 1 1;
          0.1 0.2 0.6 0.8;
          0.1 0.15 0.6 1;
          0.4 0 0.9 0.85;
          0.1 0.25 0.7 0.7;
          0 0 1 1;
          0.1 0.2 0.6 0.8;
          0.1 0.15 0.6 1;
          0.4 0 0.9 0.85;
          0.1 0.25 0.7 0.7;
          0 0 1 1
        "/>

      <!--
        Skateboard group:
        deck, two visible truck axles, and four wheels represented by two
        near wheels and two slightly offset far wheels.
        It performs a 360-degree flip during each aerial out of the coping.
      -->
      <g id="skaterBoard">
        <animateTransform
          attributeName="transform"
          attributeType="XML"
          type="rotate"
          dur="8.8s"
          repeatCount="indefinite"
          calcMode="linear"
          keyTimes="0;0.125;0.25;0.375;0.625;0.75;0.875;1"
          values="
            0 0 -19;
            0 0 -19;
            180 0 -19;
            360 0 -19;
            360 0 -19;
            540 0 -19;
            720 0 -19;
            720 0 -19"/>

        <!-- deck -->
        <rect x="-36" y="-22" width="72" height="6" rx="3" fill="#8d6e63" stroke="#4e342e" stroke-width="1"/>
        <!-- trucks / axles -->
        <rect x="-26" y="-16" width="5" height="9" fill="#607d8b"/>
        <rect x="21" y="-16" width="5" height="9" fill="#607d8b"/>
        <!-- near wheels -->
        <circle cx="-24" cy="-6" r="6" fill="#111111"/>
        <circle cx="24" cy="-6" r="6" fill="#111111"/>
        <!-- far wheels, offset slightly to imply four wheels in side view -->
        <circle cx="-20" cy="-8" r="5" fill="#2f2f2f" opacity="0.72"/>
        <circle cx="20" cy="-8" r="5" fill="#2f2f2f" opacity="0.72"/>
      </g>

      <!-- Skater body: recognizable standing figure above the board -->
      <g id="skaterBody">
        <!-- legs -->
        <path d="M-7,-22 L-13,-52 L-4,-52 Z" fill="#33415c"/>
        <path d="M7,-22 L13,-52 L4,-52 Z" fill="#33415c"/>
        <!-- torso -->
        <rect x="-9" y="-88" width="18" height="38" rx="8" fill="#dd6b20"/>
        <!-- head -->
        <circle cx="0" cy="-98" r="10" fill="#f4c7a3"/>
        <!-- arms -->
        <path d="M-9,-80 C -26,-72 -32,-62 -24,-54"
              fill="none" stroke="#f4c7a3" stroke-width="7" stroke-linecap="round"/>
        <path d="M9,-80 C 26,-72 32,-62 24,-54"
              fill="none" stroke="#f4c7a3" stroke-width="7" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>