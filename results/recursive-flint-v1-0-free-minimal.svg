<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F7FA"/>
    </linearGradient>
    
    <!-- Pipe Gradient (Concrete) -->
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#424242"/>
      <stop offset="50%" stop-color="#757575"/>
      <stop offset="100%" stop-color="#212121"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#skyGrad)"/>
  
  <!-- Clouds -->
  <ellipse cx="150" cy="80" rx="70" ry="20" fill="white" opacity="0.8"/>
  <ellipse cx="200" cy="70" rx="50" ry="15" fill="white" opacity="0.8"/>
  <ellipse cx="600" cy="120" rx="80" ry="25" fill="white" opacity="0.8"/>
  <ellipse cx="650" cy="110" rx="60" ry="18" fill="white" opacity="0.8"/>

  <!-- Ground -->
  <rect y="450" width="800" height="150" fill="#9E9E9E"/>
  <rect y="445" width="800" height="10" fill="#8E8E8E"/>

  <!-- The Pipe -->
  <rect x="380" y="20" width="40" height="430" rx="20" fill="url(#pipeGrad)"/>
  <rect x="380" y="20" width="12" height="430" rx="6" fill="#9E9E9E" opacity="0.6"/>

  <!-- Skater Group -->
  <g transform="translate(50, 400)">
    <!-- Animate Movement (Pop, Land, Ride Away) -->
    <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="translate"
      values="0 0; 350 0; 350 -150; 350 -150; 350 -150; 350 0; -350 0"
      dur="6s"
      repeatCount="indefinite" />
    
    <g>
      <!-- Animate Rotation (Kickflip Physics) -->
      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="rotate"
        values="0 0 -5; 0 0 -5; 45 0 -5; 180 0 -5; 360 0 -5; 360 0 -5; 0 0 -5; 0 0 -5"
        dur="6s"
        repeatCount="indefinite" />
      
      <!-- Skateboard -->
      <rect x="-30" y="-10" width="60" height="10" rx="5" fill="#FF5722"/>
      <circle cx="-25" cy="-5" r="4" fill="#212121"/>
      <circle cx="25" cy="-5" r="4" fill="#212121"/>
      
      <!-- Body & Limbs -->
      <line x1="0" y1="-20" x2="0" y2="-60" stroke="#333333" stroke-width="8" stroke-linecap="round"/>
      <circle cx="0" cy="-70" r="10" fill="#FFC107"/>
      
      <line x1="0" y1="-50" x2="-15" y2="-60" stroke="#333333" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="-50" x2="15" y2="-60" stroke="#333333" stroke-width="6" stroke-linecap="round"/>
      
      <line x1="0" y1="0" x2="0" y2="20" stroke="#333333" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-10" y2="25" stroke="#333333" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="10" y2="25" stroke="#333333" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Motion Lines (Speed effect) -->
  <line x1="100" y1="400" x2="180" y2="400" stroke="black" stroke-width="2" opacity="0.5"/>
  <line x1="120" y1="400" x2="160" y2="400" stroke="black" stroke-width="2" opacity="0.5"/>

</svg>