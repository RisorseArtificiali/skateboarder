<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="700" viewBox="0 0 1200 700"
     role="img" aria-labelledby="title description">
  <title id="title">Skateboarder performing aerial tricks on a half-pipe</title>
  <desc id="description">
    A seamless twelve-second animation. The skater slows while climbing each
    transition, accelerates toward the flat bottom, and follows sampled
    parabolic trajectories while airborne. The board completes a 360-degree
    spin during the first aerial and is aligned well before landing.
  </desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a38"/>
      <stop offset="0.55" stop-color="#285477"/>
      <stop offset="1" stop-color="#ef9a78"/>
    </linearGradient>
    <linearGradient id="rampFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7693a6"/>
      <stop offset="0.45" stop-color="#506d82"/>
      <stop offset="1" stop-color="#2b4358"/>
    </linearGradient>
    <linearGradient id="deckPaint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8c42"/>
      <stop offset="0.5" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff8c42"/>
    </linearGradient>
    <linearGradient id="shirtPaint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2de2b4"/>
      <stop offset="1" stop-color="#089f9a"/>
    </linearGradient>
  </defs>

  <!-- Background: dusk sky, moon, clouds, distant hills, and ground. -->
  <g id="background">
    <rect width="1200" height="700" fill="url(#sky)"/>
    <circle cx="1035" cy="105" r="43" fill="#ffe8b6" opacity="0.9"/>
    <circle cx="1022" cy="94" r="43" fill="#162543" opacity="0.2"/>

    <g fill="#eaf5ff" opacity="0.16">
      <path d="M85 139c12-24 48-23 59 1 24-13 54 3 54 27H50c0-21 17-31 35-28z"/>
      <path d="M727 102c10-19 38-20 49-2 20-10 45 3 46 23H696c0-16 14-24 31-21z"/>
      <path d="M950 205c8-15 30-16 39-2 16-8 36 2 37 18H925c0-13 11-20 25-16z"/>
    </g>

    <path d="M0 414Q130 334 266 411T535 398T805 407T1200 375V650H0Z"
          fill="#203c50" opacity="0.58"/>
    <path d="M0 478Q155 403 310 469T620 456T910 462T1200 432V650H0Z"
          fill="#182f43" opacity="0.8"/>

    <g fill="#14283a" opacity="0.72">
      <rect x="34" y="400" width="48" height="144"/>
      <rect x="91" y="438" width="70" height="106"/>
      <rect x="1055" y="404" width="57" height="140"/>
      <rect x="1122" y="446" width="48" height="98"/>
    </g>

    <rect y="625" width="1200" height="75" fill="#142737"/>
    <ellipse cx="600" cy="646" rx="548" ry="25" fill="#08121e" opacity="0.48"/>
  </g>

  <!-- Half-pipe structure: mirrored left and right quarter pipes with a flat bottom. -->
  <g id="half-pipe">
    <path d="M90 260H250V300
             C250 440 320 550 450 550
             H750
             C880 550 950 440 950 300
             V260H1110V640H90Z"
          fill="url(#rampFace)"
          stroke="#182c3e" stroke-width="4" stroke-linejoin="round"/>

    <g fill="none" stroke="#b8cfda" stroke-width="2" opacity="0.13">
      <path d="M126 278V622M181 278V622M1019 278V622M1074 278V622"/>
      <path d="M474 560V626M535 560V626M600 560V626M665 560V626M726 560V626"/>
      <path d="M98 610H1102"/>
    </g>

    <g fill="#d5e6ec" opacity="0.18">
      <circle cx="124" cy="596" r="3"/>
      <circle cx="180" cy="596" r="3"/>
      <circle cx="474" cy="596" r="3"/>
      <circle cx="600" cy="596" r="3"/>
      <circle cx="726" cy="596" r="3"/>
      <circle cx="1020" cy="596" r="3"/>
      <circle cx="1076" cy="596" r="3"/>
    </g>
  </g>

  <!-- Riding surface and coping: the bright continuous line is the board's ramp contact profile. -->
  <g id="ramp-surface" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M90 260H250V300
             C250 440 320 550 450 550
             H750
             C880 550 950 440 950 300
             V260H1110"
          stroke="#14283a" stroke-width="13" opacity="0.42"/>
    <path d="M90 260H250V300
             C250 440 320 550 450 550
             H750
             C880 550 950 440 950 300
             V260H1110"
          stroke="#d9e8eb" stroke-width="5"/>
    <path d="M105 253H238M962 253H1095"
          stroke="#9fb9c5" stroke-width="3" opacity="0.7"/>
    <circle cx="250" cy="260" r="8" fill="#eef7f7" stroke="#263e50" stroke-width="3"/>
    <circle cx="950" cy="260" r="8" fill="#eef7f7" stroke="#263e50" stroke-width="3"/>
  </g>

  <!--
    Skater motion rig. Uneven time spacing produces slower motion near the
    coping and maximum speed at the bottom. Each aerial has constant horizontal
    velocity and quadratic vertical position, approximating ballistic gravity.
    The final position, direction, and attitude exactly match the initial ones.
  -->
  <g id="skater-motion" transform="translate(600 533)">
    <animateTransform
      attributeName="transform" type="translate"
      dur="12s" repeatCount="indefinite" calcMode="linear"
      keyTimes="
        0;
        0.036667;
        0.057;
        0.0775;
        0.1015;
        0.12;
        0.134333;
        0.140333;
        0.175583;
        0.210917;
        0.246167;
        0.281417;
        0.316667;
        0.352;
        0.38725;
        0.4225;
        0.442917;
        0.463333;
        0.5;
        0.536667;
        0.557;
        0.5775;
        0.6015;
        0.62;
        0.634333;
        0.640333;
        0.675583;
        0.710917;
        0.746167;
        0.781417;
        0.816667;
        0.852;
        0.88725;
        0.9225;
        0.942917;
        0.963333;
        1"
      values="
        600 533;
        750 533;
        828.5 515.4;
        885.15 467.3;
        920.7 393.4;
        931 339.3;
        933 300;
        933 285;
        927.02 213.29;
        921.04 168.58;
        915.06 150.86;
        909.08 160.15;
        903.09 196.44;
        897.11 259.73;
        891.13 350.01;
        885.15 467.3;
        828.5 515.4;
        750 533;
        600 533;
        450 533;
        371.5 515.4;
        314.85 467.3;
        279.3 393.4;
        269 339.3;
        267 300;
        267 285;
        272.98 213.29;
        278.96 168.58;
        284.94 150.86;
        290.93 160.15;
        296.91 196.44;
        302.89 259.73;
        308.87 350.01;
        314.85 467.3;
        371.5 515.4;
        450 533;
        600 533"/>

    <!-- Attitude: the deck follows the transition, levels in flight, and realigns for landing. -->
    <g id="skater-attitude">
      <animateTransform
        attributeName="transform" type="rotate"
        dur="12s" repeatCount="indefinite" calcMode="linear"
        keyTimes="
          0;
          0.036667;
          0.057;
          0.0775;
          0.1015;
          0.12;
          0.134333;
          0.140333;
          0.175583;
          0.210917;
          0.246167;
          0.281417;
          0.316667;
          0.352;
          0.38725;
          0.4225;
          0.442917;
          0.463333;
          0.5;
          0.536667;
          0.557;
          0.5775;
          0.6015;
          0.62;
          0.634333;
          0.640333;
          0.675583;
          0.710917;
          0.746167;
          0.781417;
          0.816667;
          0.852;
          0.88725;
          0.9225;
          0.942917;
          0.963333;
          1"
        values="
          0;
          0;
          -26.7;
          -50;
          -65;
          -68;
          -70;
          -65;
          -38;
          -12;
          0;
          0;
          -4;
          -18;
          -38;
          -50;
          -26.7;
          0;
          0;
          0;
          26.7;
          50;
          65;
          68;
          70;
          65;
          38;
          12;
          0;
          0;
          4;
          18;
          38;
          50;
          26.7;
          0;
          0"/>

      <!--
        Aerial board trick: one full 360-degree spin during the right-hand air.
        It finishes at four seconds, over a second before touchdown. Holding
        360 degrees is visually identical to zero, preserving the loop seam.
      -->
      <g id="board-trick">
        <animateTransform
          attributeName="transform" type="rotate"
          dur="12s" repeatCount="indefinite" calcMode="linear"
          keyTimes="0;0.166667;0.208333;0.25;0.291667;0.333333;1"
          values="0;0;90;180;270;360;360"/>

        <!-- Skateboard: concave deck, two trucks, and four individually drawn wheels. -->
        <g id="skateboard">
          <g id="far-wheels" fill="#8ea5b5" stroke="#172638" stroke-width="2">
            <circle cx="-20" cy="8" r="5"/>
            <circle cx="28" cy="8" r="5"/>
          </g>

          <g id="trucks" fill="none" stroke="#b9c8d1" stroke-width="4"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M-27 1L-24 9M-31 10L-17 7"/>
            <path d="M27 1L24 9M17 7L31 10"/>
          </g>

          <path d="M-44-5Q-40-12-33-8H33Q40-12 44-5L39 1Q0 7-39 1Z"
                fill="url(#deckPaint)" stroke="#472b35" stroke-width="2"/>
          <path d="M-34-8H34" fill="none" stroke="#202b3b" stroke-width="3"
                stroke-linecap="round"/>
          <g fill="#263648">
            <circle cx="-27" cy="-5" r="1.5"/>
            <circle cx="-23" cy="-5" r="1.5"/>
            <circle cx="23" cy="-5" r="1.5"/>
            <circle cx="27" cy="-5" r="1.5"/>
          </g>

          <g id="near-wheels" fill="#f4f7f5" stroke="#172638" stroke-width="2">
            <circle cx="-27" cy="13" r="6"/>
            <circle cx="21" cy="13" r="6"/>
            <circle cx="-27" cy="13" r="2" fill="#ff8c42"/>
            <circle cx="21" cy="13" r="2" fill="#ff8c42"/>
          </g>
        </g>
      </g>

      <!-- Rider: helmeted skater in a balanced, knees-bent skating stance. -->
      <g id="rider" stroke-linecap="round" stroke-linejoin="round">
        <!-- Rear balancing arm. -->
        <path d="M-20-96L-43-81L-61-91"
              fill="none" stroke="#efb08b" stroke-width="9"/>
        <path d="M-20-96L-34-87"
              fill="none" stroke="#0caaa1" stroke-width="14"/>
        <circle cx="-62" cy="-92" r="5" fill="#efb08b"/>

        <!-- Forward balancing arm. -->
        <path d="M0-96L27-82L47-96"
              fill="none" stroke="#efb08b" stroke-width="9"/>
        <path d="M0-96L17-87"
              fill="none" stroke="#0caaa1" stroke-width="14"/>
        <circle cx="48" cy="-97" r="5" fill="#efb08b"/>

        <!-- Bent legs. -->
        <path d="M-8-67L-30-47L-24-18"
              fill="none" stroke="#202c49" stroke-width="15"/>
        <path d="M-8-67L13-49L20-18"
              fill="none" stroke="#2c3b5c" stroke-width="15"/>
        <circle cx="-30" cy="-47" r="7" fill="#263552"/>
        <circle cx="13" cy="-49" r="7" fill="#354566"/>

        <!-- Shoes remain on the deck while the board spins beneath them. -->
        <path d="M-33-17H-20L-14-10Q-22-7-35-9Q-38-13-33-17Z"
              fill="#f3f5f4" stroke="#172638" stroke-width="2"/>
        <path d="M12-17H24L31-10Q22-7 10-9Q7-13 12-17Z"
              fill="#f3f5f4" stroke="#172638" stroke-width="2"/>

        <!-- Torso and shirt. -->
        <path d="M-27-101Q-13-110 5-100L12-74Q3-62-12-65L-25-78Z"
              fill="url(#shirtPaint)" stroke="#075f68" stroke-width="2"/>
        <path d="M-19-72Q-5-67 8-73"
              fill="none" stroke="#8ff4d5" stroke-width="3" opacity="0.7"/>

        <!-- Neck, face, and protective helmet. -->
        <path d="M-18-108L-17-116L-7-115L-5-105"
              fill="#efb08b" stroke="#172638" stroke-width="2"/>
        <circle cx="-12" cy="-126" r="14"
                fill="#efb08b" stroke="#172638" stroke-width="2"/>
        <path d="M-27-128Q-26-143-12-145Q2-143 3-128Z"
              fill="#ffd166" stroke="#172638" stroke-width="2"/>
        <path d="M-12-128H8Q10-125 5-124H-12Z"
              fill="#f4b942" stroke="#172638" stroke-width="2"/>
        <circle cx="-5" cy="-126" r="1.8" fill="#172638"/>
        <path d="M-25-124Q-24-113-17-109"
              fill="none" stroke="#172638" stroke-width="2"/>
      </g>
    </g>
  </g>
</svg>